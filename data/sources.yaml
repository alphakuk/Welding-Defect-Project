    version: 12
    class_map:
      Underfill: underfill
      Arc Strike: arc_strike
      Pin Hole: blowhole        # 비드 표면의 작은 가스 구멍 = 블로홀 정의
      Spatter: spatter
      Lack Of Fusion: null
      Unequal Leg: null
      Poor Stop Start: null
      Excess Metal: null
      Crater Pipe: null

