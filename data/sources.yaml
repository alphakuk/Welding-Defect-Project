# Roboflow Universe 소스 -> 9개 결함 클래스 매핑 (null = 제외)
# 클래스: incomplete_penetration crack undercut underfill arc_strike porosity blowhole spatter overlap
# 희소 클래스 소스를 앞에 둔다 (max_images_per_class 상한은 앞 소스부터 채워짐, 원본 기준)
# keep_aug(기본 true): Roboflow 증강 사본을 train에 모두 사용. val/test는 원본 1장만

max_images_per_class: 1500
# train에서 이미지가 이 수보다 적은 결함은 해당 사진을 반복 사용 (최대 배수)
oversample_min_images: 600
oversample_max_factor: 6

